<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结业证书预览 - 美识集·小小美育课</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #414C39;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .toolbar {
    width: 100%;
    max-width: 900px;
    background: #F7F2E8;
    border-radius: 12px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .toolbar label {
    font-weight: 700;
    color: #414C39;
    font-size: 14px;
  }
  .toolbar input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 2px solid #C7A19B;
    border-radius: 8px;
    font-size: 16px;
    color: #414C39;
    background: #fff;
    outline: none;
  }
  .toolbar input:focus {
    border-color: #414C39;
  }
  .toolbar button {
    padding: 10px 20px;
    background: #414C39;
    color: #F7F2E8;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toolbar button:hover {
    background: #2f3829;
  }
  .toolbar .hint {
    width: 100%;
    color: #6B5D4F;
    font-size: 12px;
    margin-top: -8px;
  }
  .preview-wrap {
    width: 100%;
    max-width: 900px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    background: #F7F2E8;
  }
  #certCanvas {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div class="toolbar">
  <label for="nameInput">昵称：</label>
  <input type="text" id="nameInput" value="小明" maxlength="12" placeholder="输入昵称">
  <button onclick="downloadPNG()">下载 PNG</button>
  <span class="hint">输入昵称后证书实时更新，点击下载可保存 1600×1131 高清图片</span>
</div>

<div class="preview-wrap">
  <canvas id="certCanvas" width="1600" height="1131"></canvas>
</div>

<script>
var canvas = document.getElementById("certCanvas");
var nameInput = document.getElementById("nameInput");

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCornerPattern(ctx, x, y, size, color, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";

  var pad = 4;

  // 外层L形线
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(pad, size - pad);
  ctx.lineTo(pad, pad);
  ctx.lineTo(size - pad, pad);
  ctx.stroke();

  // 内层L形线
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pad + 9, size - pad - 9);
  ctx.lineTo(pad + 9, pad + 9);
  ctx.lineTo(size - pad - 9, pad + 9);
  ctx.stroke();

  // 沿水平边的小菱形
  var ds = 4;
  var spacing = 10;
  var count = Math.floor((size - pad * 2 - 20) / spacing);
  for (var i = 0; i < count; i++) {
    var dx = pad + 14 + i * spacing;
    var dy = pad + 4.5;
    ctx.beginPath();
    ctx.moveTo(dx, dy - ds);
    ctx.lineTo(dx + ds, dy);
    ctx.lineTo(dx, dy + ds);
    ctx.lineTo(dx - ds, dy);
    ctx.closePath();
    ctx.fill();
  }

  // 沿垂直边的小菱形
  for (var j = 0; j < count; j++) {
    var dx2 = pad + 4.5;
    var dy2 = pad + 14 + j * spacing;
    ctx.beginPath();
    ctx.moveTo(dx2, dy2 - ds);
    ctx.lineTo(dx2 + ds, dy2);
    ctx.lineTo(dx2, dy2 + ds);
    ctx.lineTo(dx2 - ds, dy2);
    ctx.closePath();
    ctx.fill();
  }

  // 角落如意云头
  var cx = pad + 5;
  var cy = pad + 5;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx + 5, cy, 5, Math.PI, Math.PI * 1.5);
  ctx.arc(cx + 5, cy + 5, 5, Math.PI * 1.5, 0);
  ctx.stroke();
  // 云头中心小点
  ctx.beginPath();
  ctx.arc(cx + 5, cy + 2.5, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSeal(ctx, x, y, radius) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.08);
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#B83A2D";
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, radius - 8, 0, Math.PI * 2);
  ctx.strokeStyle = "#B83A2D";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "#B83A2D";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "700 " + Math.floor(radius * 0.52) + "px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("美识集", 0, 2);
  ctx.restore();
}

function getCertNumber() {
  return "MXJ-2026-0823";
}

function drawCertificate(name) {
  var ctx = canvas.getContext("2d");
  var W = canvas.width;
  var H = canvas.height;
  var ink = "#414C39";
  var inkSoft = "#6B5D4F";
  var clay = "#C7A19B";
  var paper = "#F7F2E8";
  var red = "#B83A2D";

  // 1. 背景
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, W, H);

  // 2. 宣纸纹理
  ctx.fillStyle = "rgba(65, 76, 57, 0.018)";
  for (var i = 0; i < 600; i++) {
    ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
  }

  // 3. 双层边框
  ctx.strokeStyle = ink;
  ctx.lineWidth = 12;
  ctx.strokeRect(42, 42, W - 84, H - 84);
  ctx.strokeStyle = clay;
  ctx.lineWidth = 3;
  ctx.strokeRect(68, 68, W - 136, H - 136);

  // 4. 四角回纹
  var cornerColor = "rgba(65, 76, 57, 0.3)";
  drawCornerPattern(ctx, 85, 85, 70, cornerColor, 0);
  drawCornerPattern(ctx, W - 85, 85, 70, cornerColor, Math.PI / 2);
  drawCornerPattern(ctx, W - 85, H - 85, 70, cornerColor, Math.PI);
  drawCornerPattern(ctx, 85, H - 85, 70, cornerColor, -Math.PI / 2);

  // 5. 品牌名
  ctx.textAlign = "center";
  ctx.fillStyle = inkSoft;
  ctx.font = "400 30px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("美识集 · 小小美育课", W / 2, 145);

  // 装饰线+菱形
  ctx.strokeStyle = clay;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 130, 166);
  ctx.lineTo(W / 2 - 14, 166);
  ctx.moveTo(W / 2 + 14, 166);
  ctx.lineTo(W / 2 + 130, 166);
  ctx.stroke();
  ctx.fillStyle = clay;
  ctx.beginPath();
  ctx.moveTo(W / 2, 158);
  ctx.lineTo(W / 2 + 9, 166);
  ctx.lineTo(W / 2, 174);
  ctx.lineTo(W / 2 - 9, 166);
  ctx.closePath();
  ctx.fill();

  // 6. 主标题
  ctx.fillStyle = ink;
  ctx.font = "700 86px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("结 业 证 书", W / 2, 252);

  // 英文
  ctx.fillStyle = clay;
  ctx.font = "400 20px Georgia, serif";
  ctx.fillText("C E R T I F I C A T E", W / 2, 294);

  // 7. 证书编号
  ctx.textAlign = "left";
  ctx.fillStyle = inkSoft;
  ctx.font = "400 22px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("证书编号：" + getCertNumber(), 130, 348);

  // 8. 兹证明
  ctx.textAlign = "center";
  ctx.fillStyle = ink;
  ctx.font = "400 30px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("兹 证 明", W / 2, 412);

  // 9. 昵称
  ctx.fillStyle = ink;
  ctx.font = "700 74px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText(name, W / 2, 500);
  var nameWidth = ctx.measureText(name).width;
  var lineWidth = Math.min(nameWidth + 80, 520);
  ctx.strokeStyle = clay;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2 - lineWidth / 2, 528);
  ctx.lineTo(W / 2 + lineWidth / 2, 528);
  ctx.stroke();

  // 10. 证明正文
  ctx.textAlign = "center";
  ctx.fillStyle = ink;
  ctx.font = "400 26px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  var bodyLines = [
    "完成了「传统美学的10个秘密」全部课程，",
    "系统学习了颜色、花纹、建筑、绘画、书法、",
    "陶瓷、服饰、园林、节日、石窟十大主题，"
  ];
  bodyLines.forEach(function (line, idx) {
    ctx.fillText(line, W / 2, 588 + idx * 42);
  });

  // 荣誉称号
  ctx.fillStyle = red;
  ctx.font = "700 30px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("特授予「传统美学小博士」荣誉称号。", W / 2, 730);

  // 11. 四个数据卡片
  var cardY = 788;
  var cardW = 220;
  var cardH = 92;
  var cardGap = 28;
  var totalW = cardW * 4 + cardGap * 3;
  var startX = (W - totalW) / 2;
  var stats = [
    { num: "10", label: "节课完整学习" },
    { num: "30", label: "个知识点掌握" },
    { num: "10", label: "个互动游戏" },
    { num: "10", label: "句好记口诀" }
  ];
  stats.forEach(function (stat, idx) {
    var x = startX + idx * (cardW + cardGap);
    ctx.fillStyle = "rgba(199, 161, 155, 0.12)";
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(199, 161, 155, 0.45)";
    ctx.lineWidth = 1.5;
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.stroke();
    ctx.fillStyle = ink;
    ctx.font = "700 38px 'Microsoft YaHei', 'PingFang SC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(stat.num, x + cardW / 2, cardY + 44);
    ctx.fillStyle = inkSoft;
    ctx.font = "400 16px 'Microsoft YaHei', 'PingFang SC', sans-serif";
    ctx.fillText(stat.label, x + cardW / 2, cardY + 70);
  });

  // 12. 课程亮点
  ctx.textAlign = "left";
  ctx.fillStyle = inkSoft;
  ctx.font = "400 20px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  var highlights = [
    "✓ 内容参考故宫博物院、敦煌研究院、UNESCO等公开权威资料",
    "✓ 严格区分史实与民间传说，不杜撰、不歪曲",
    "✓ 每课配套互动游戏和动手练习，边玩边学"
  ];
  highlights.forEach(function (h, idx) {
    ctx.fillText(h, 160, 920 + idx * 32);
  });

  // 13. 印章
  drawSeal(ctx, W - 230, H - 185, 56);

  // 14. 日期
  ctx.textAlign = "right";
  ctx.fillStyle = ink;
  ctx.font = "400 24px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  var dateStr = new Intl.DateTimeFormat("zh-CN", {
    year: "numeric", month: "long", day: "numeric"
  }).format(new Date());
  ctx.fillText("颁发日期：" + dateStr, W - 130, H - 132);

  // 15. 底部品牌语
  ctx.textAlign = "center";
  ctx.fillStyle = inkSoft;
  ctx.font = "400 20px 'Microsoft YaHei', 'PingFang SC', sans-serif";
  ctx.fillText("美识集 · 把传统美学，变成小朋友听得懂的语言", W / 2, H - 92);
}

function downloadPNG() {
  var name = nameInput.value.trim() || "小小美学家";
  drawCertificate(name);
  canvas.toBlob(function (blob) {
    if (!blob) return;
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "小小美育课结业证书_" + name + ".png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
  }, "image/png");
}

// 初始渲染
drawCertificate(nameInput.value);

// 输入时实时更新
nameInput.addEventListener("input", function () {
  drawCertificate(nameInput.value || "小小美学家");
});
</script>

</body>
</html>
